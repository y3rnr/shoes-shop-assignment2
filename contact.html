<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRIDE — Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="logo-text">STRIDE</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="about.html">About Team</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <div class="contact-header">
                <h1>Contact Us</h1>
                <p>Have questions about sizes, delivery, or cooperation? Fill out the form below.</p>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Write your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" placeholder="Write your email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 STRIDE Shoes Shop Team. All rights reserved.</p>
    </footer>

</body>
</html>
